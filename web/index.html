<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>Open Rebellion — Star Wars Rebellion</title>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; background: #050510; }
        canvas { display: block; width: 100vw; height: 100vh; }
        /* The game takes focus on start; the browser's focus ring would
           draw a frame the original's window does not have. */
        canvas:focus { outline: none; }
        #main-menu-semantics button {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            clip-path: inset(50%);
            white-space: nowrap;
            border: 0;
            pointer-events: none;
        }
        /* Not part of the original: a page link in the letterbox bar, never
           over the 4:3 game picture, hidden when the window has no bar. */
        #report-problem {
            position: fixed;
            display: none;
            font: 12px sans-serif;
            color: #8890a0;
            text-decoration: none;
            white-space: nowrap;
        }
        #report-problem:hover, #report-problem:focus-visible { color: #e8ecf4; text-decoration: underline; }
        /* Not part of the original: the folder picker of the own-data
           mode (registerOwnData below). */
        #own-data {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(5, 5, 16, 0.94);
            color: #d8dce8;
            font: 15px/1.5 sans-serif;
        }
        #own-data[hidden] { display: none; }
        #own-data .panel { max-width: 34em; padding: 1.5em 2em; border: 1px solid #39405a; background: #0c0e1c; }
        #own-data h1 { font-size: 1.2em; margin: 0 0 0.8em; color: #f0f2f8; }
        #own-data button { font: inherit; padding: 0.4em 1.2em; cursor: pointer; }
        #own-data-status:empty { display: none; }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <a id="report-problem" href="https://github.com/MaxOssowski/open-rebellion/issues/new/choose"
       target="_blank" rel="noopener"
       title="Downloads your saved games as one file and opens the issue form; attach the file there">Report a problem</a>
    <nav id="main-menu-semantics" aria-label="Open Rebellion main menu" hidden>
        <button type="button" data-menu-index="0">Easy difficulty, X-wing</button>
        <button type="button" data-menu-index="1">Intermediate difficulty, Star Destroyer</button>
        <button type="button" data-menu-index="2">Expert difficulty, Death Star</button>
        <button type="button" data-menu-index="3">Cycle galaxy size</button>
        <button type="button" data-menu-index="4">Small galaxy</button>
        <button type="button" data-menu-index="5">Medium galaxy</button>
        <button type="button" data-menu-index="6">Large galaxy</button>
        <button type="button" data-menu-index="7">Toggle Standard or Headquarters Victory game</button>
        <button type="button" data-menu-index="8">Start as the Galactic Empire</button>
        <button type="button" data-menu-index="9">Start as the Rebel Alliance</button>
        <button type="button" data-menu-index="10">Load game and options</button>
        <button type="button" data-menu-index="11">Credits</button>
        <button type="button" data-menu-index="12">Multiplayer</button>
        <button type="button" data-menu-index="13">Quit</button>
        <button type="button" data-menu-index="14">Menu music</button>
        <button type="button" data-menu-index="15" aria-haspopup="dialog">Fleet registry</button>
    </nav>
    <!-- macroquad/miniquad JS glue — provides load() and WebGL bindings -->
    <script src="gl.js"></script>
    <script>
        (function registerMainMenuAccessibility() {
            "use strict";

            const root = document.getElementById("main-menu-semantics");
            const canvas = document.getElementById("glcanvas");
            const buttons = Array.from(root.querySelectorAll("button[data-menu-index]"));
            let active = false;

            function callExport(name, value) {
                if (wasm_exports && typeof wasm_exports[name] === "function") {
                    wasm_exports[name](value);
                }
            }

            function focusButton(index) {
                const wrapped = (index + buttons.length) % buttons.length;
                buttons[wrapped].focus({ preventScroll: true });
            }

            function register(imports) {
                imports.env.open_rebellion_quit = function () {
                    document.querySelectorAll("canvas").forEach((canvas) => { canvas.hidden = true; });
                    const screen = document.createElement("section");
                    screen.setAttribute("aria-label", "Game closed");
                    screen.style.cssText = "position:fixed;inset:0;display:grid;place-content:center;gap:1rem;background:#080b12;color:#eee;text-align:center;font:20px sans-serif";
                    const title = document.createElement("h1");
                    title.textContent = "Game closed";
                    const restart = document.createElement("button");
                    restart.textContent = "Restart game";
                    restart.onclick = () => window.location.reload();
                    screen.append(title, restart);
                    document.body.append(screen);
                    restart.focus();
                };
                imports.env.open_rebellion_a11y_sync = function (
                    isActive,
                    focused,
                    difficulty,
                    galaxySize,
                    headquartersOnly,
                    musicEnabled,
                ) {
                    const nextActive = Boolean(isActive);
                    const ownedFocus = buttons.includes(document.activeElement);
                    active = nextActive;
                    root.hidden = !active;
                    root.dataset.active = String(active);
                    buttons.forEach((button, index) => {
                        button.tabIndex = active ? 0 : -1;
                        button.dataset.focused = String(index === focused);
                    });

                    for (const index of [0, 1, 2]) {
                        buttons[index].setAttribute("aria-pressed", String(index === difficulty));
                    }
                    for (const index of [4, 5, 6]) {
                        buttons[index].setAttribute("aria-pressed", String(index === galaxySize));
                    }
                    buttons[7].setAttribute("aria-pressed", String(Boolean(headquartersOnly)));
                    buttons[14].setAttribute("aria-pressed", String(Boolean(musicEnabled)));

                    const galaxyLabel = buttons[galaxySize].textContent;
                    buttons[3].setAttribute(
                        "aria-label",
                        `Cycle galaxy size, current ${galaxyLabel}`,
                    );
                    buttons[7].setAttribute(
                        "aria-label",
                        `Toggle game type, current ${
                            headquartersOnly ? "Headquarters Only" : "Standard Game"
                        }`,
                    );

                    if (!active && ownedFocus) {
                        canvas.focus({ preventScroll: true });
                    }
                };
            }

            function onInit() {
                buttons.forEach((button, index) => {
                    button.addEventListener("focus", () => {
                        if (active) {
                            callExport("open_rebellion_menu_focus", index);
                        }
                    });
                    button.addEventListener("blur", () => {
                        if (active) {
                            callExport("open_rebellion_menu_focus", -1);
                        }
                    });
                    button.addEventListener("click", event => {
                        event.preventDefault();
                        if (active) {
                            callExport("open_rebellion_menu_activate", index);
                        }
                    });
                    button.addEventListener("keydown", event => {
                        let offset = 0;
                        if (event.key === "Tab") {
                            offset = event.shiftKey ? -1 : 1;
                        } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
                            offset = -1;
                        } else if (event.key === "ArrowRight" || event.key === "ArrowDown") {
                            offset = 1;
                        }
                        if (offset !== 0) {
                            event.preventDefault();
                            event.stopPropagation();
                            focusButton(index + offset);
                        }
                    });
                });

                // Miniquad consumes Tab on its canvas. Move it into the
                // semantic control order first and suppress the duplicate
                // canvas traversal.
                canvas.addEventListener("keydown", event => {
                    if (active && event.key === "Tab") {
                        event.preventDefault();
                        event.stopImmediatePropagation();
                        focusButton(event.shiftKey ? buttons.length - 1 : 0);
                    }
                }, true);
            }

            miniquad_add_plugin({
                register_plugin: register,
                on_init: onInit,
                version: 1,
                name: "open_rebellion_a11y",
            });
        }());
    </script>
    <script>
        (function registerReplayEquivalenceGate() {
            "use strict";

            const params = new URLSearchParams(window.location.search);
            const values = params.getAll("replay-check");
            // 1: the seed-42 fixture; 3: the multi-seed sweep; 2: any
            // other value, which fails closed in the query phase.
            const mode = values.length === 0
                ? 0
                : values.length === 1 && values[0] === "seed42-v1"
                    ? 1
                    : values.length === 1 && values[0] === "sweep-v1"
                        ? 3
                        : 2;

            function register(imports) {
                imports.env.open_rebellion_replay_mode = function () {
                    return mode;
                };
                imports.env.open_rebellion_replay_emit = function (ptr, len) {
                    try {
                        const bytes = new Uint8Array(wasm_memory.buffer, ptr, len);
                        const text = new TextDecoder("utf-8", { fatal: true }).decode(bytes);
                        window.__openRebellionReplay = JSON.parse(text);
                    } catch (error) {
                        window.__openRebellionReplay = {
                            schema_version: 1,
                            fixture_id: "seed42-v1",
                            platform: "javascript-bridge",
                            status: "failed",
                            failure_phase: "bridge",
                            error: String(error),
                        };
                    }
                    window.dispatchEvent(new CustomEvent(
                        "open-rebellion-replay-complete",
                        { detail: window.__openRebellionReplay },
                    ));
                };
            }

            miniquad_add_plugin({
                register_plugin: register,
                version: 1,
                name: "open_rebellion_replay",
            });
        }());
    </script>
    <script>
        // Cutscenes: the game names a movie (ref-videos stem) and the page
        // plays data/video/<stem>.webm in a <video> over the canvas's
        // 640 by 480 client, keeping its aspect, as the native player draws
        // its frames. Around the movie the canvas shows through: its black,
        // and a story movie's caption under it (FUN_0041ecf0). The game
        // polls the state and stops it on a skip.
        (function registerCutscenes() {
            "use strict";

            // FAILED: the file could not be loaded (the game shows the
            // video manager's error box, FUN_005f6920); REFUSED: the
            // browser would not start it even muted (the game goes on).
            const IDLE = 0, PLAYING = 1, ENDED = 2, FAILED = 3, REFUSED = 4;
            let video = null;
            let state = IDLE;

            function finish(next) {
                state = next;
                if (video) {
                    video.pause();
                    video.removeAttribute("src");
                    video.load();
                    video.remove();
                    video = null;
                }
                window.__openRebellionCutscene = { state };
            }

            function register(imports) {
                imports.env.open_rebellion_video_play = function (ptr, len, volume) {
                    let stem;
                    try {
                        stem = new TextDecoder("utf-8", { fatal: true })
                            .decode(new Uint8Array(wasm_memory.buffer, ptr, len));
                    } catch (error) {
                        return 0;
                    }
                    if (!/^[0-9A-Za-z_-]+$/.test(stem)) return 0;
                    finish(IDLE);
                    video = document.createElement("video");
                    video.style.cssText = "position:fixed;inset:0;margin:auto;width:min(100vw,calc(100vh*4/3));height:min(100vh,calc(100vw*3/4));object-fit:contain;background:transparent;pointer-events:none;z-index:10";
                    video.playsInline = true;
                    video.preload = "auto";
                    video.volume = Math.max(0, Math.min(1, volume));
                    video.src = "data/video/" + stem + ".webm";
                    video.addEventListener("ended", () => finish(ENDED));
                    video.addEventListener("error", () => finish(FAILED));
                    document.body.append(video);
                    state = PLAYING;
                    window.__openRebellionCutscene = { state, stem };
                    // Before any gesture the browser refuses sound; the movie
                    // then plays muted rather than not at all.
                    video.play().catch(() => {
                        if (!video) return;
                        if (video.error) {
                            finish(FAILED);
                            return;
                        }
                        video.muted = true;
                        video.play().catch(() => {
                            if (video) finish(video.error ? FAILED : REFUSED);
                        });
                    });
                    return 1;
                };
                imports.env.open_rebellion_video_state = function () {
                    return state;
                };
                imports.env.open_rebellion_video_stop = function () {
                    finish(ENDED);
                };
            }

            miniquad_add_plugin({
                register_plugin: register,
                version: 1,
                name: "open_rebellion_video",
            });
        }());
    </script>
    <script>
        // "Report a problem": a page link, not part of the original game.
        // It sits in the letterbox bar beside or below the 4:3 picture and
        // hides when the window leaves no bar wide enough. A click
        // downloads the saved games (openRebellion.exportSaves, gl.js)
        // when there are any, and the link opens the GitHub issue form.
        (function () {
            "use strict";
            var link = document.getElementById("report-problem");
            var MARGIN = 8;
            function place() {
                var vw = window.innerWidth, vh = window.innerHeight;
                var side = (vw - Math.min(vw, vh * 4 / 3)) / 2;
                var below = (vh - Math.min(vh, vw * 3 / 4)) / 2;
                link.style.display = "block";
                var w = link.offsetWidth, h = link.offsetHeight;
                link.style.right = MARGIN + "px";
                if (side >= w + 2 * MARGIN) {
                    link.style.bottom = MARGIN + "px";
                } else if (below >= h + 2 * MARGIN) {
                    link.style.bottom = Math.round((below - h) / 2) + "px";
                } else {
                    link.style.display = "none";
                }
            }
            link.addEventListener("click", function () {
                try {
                    if (Object.keys(rebellionSaveStore.entries()).length > 0) openRebellion.exportSaves();
                } catch (error) {
                    console.error("Open Rebellion could not export the saves:", error);
                }
                // The game keeps the keyboard.
                setTimeout(function () { document.getElementById("glcanvas").focus(); }, 0);
            });
            window.addEventListener("resize", place);
            place();
        }());
    </script>
    <div id="own-data" hidden>
        <div class="panel" role="dialog" aria-labelledby="own-data-title" aria-describedby="own-data-text">
            <h1 id="own-data-title">Open Rebellion needs your copy of Star Wars: Rebellion</h1>
            <p id="own-data-text">Choose the game's folder: the one that holds REBEXE.EXE and the
                GData folder, such as the GOG installation. The game reads the files here, in this
                browser, and keeps what it needs for your next visit. Nothing is uploaded.</p>
            <p id="own-data-status" role="status"></p>
            <button type="button" id="own-data-choose">Choose game folder</button>
            <input type="file" id="own-data-input" webkitdirectory directory multiple hidden>
        </div>
    </div>
    <script>
        // Bring your own data (docs/plans/2026-11-24-bring-your-own-data.md).
        // Not part of the original. When the server has no runtime pack, or
        // the address asks for ?data=own, the game builds the pack from the
        // player's folder: the WASM asks for own-data/pack and this script
        // answers with the pack kept from an earlier visit, or with the list
        // of the picked files, each then served as own-data/file/<index>
        // (crates/rebellion-app/src/own_data.rs). Without the mode the
        // request is not found and the game loads data/runtime.orpk.
        (function registerOwnData() {
            "use strict";

            const DB_NAME = "open-rebellion-own-data";
            const STORE = "packs";
            const KEY = "runtime";
            const params = new URLSearchParams(window.location.search);
            const overlay = document.getElementById("own-data");
            const statusLine = document.getElementById("own-data-status");
            const choose = document.getElementById("own-data-choose");
            const input = document.getElementById("own-data-input");
            let picked = [];

            const modeOn = params.get("data") === "own"
                ? Promise.resolve(true)
                : params.get("data") === "server"
                    ? Promise.resolve(false)
                    : fetch("data/runtime.orpk", { method: "HEAD" })
                        .then(response => !response.ok, () => true);

            function openDb() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(DB_NAME, 1);
                    request.onupgradeneeded = () => request.result.createObjectStore(STORE);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }

            function withStore(mode, action) {
                return openDb().then(db => new Promise((resolve, reject) => {
                    const transaction = db.transaction(STORE, mode);
                    const request = action(transaction.objectStore(STORE));
                    transaction.oncomplete = () => { db.close(); resolve(request.result); };
                    transaction.onerror = () => { db.close(); reject(transaction.error); };
                    transaction.onabort = () => { db.close(); reject(transaction.error); };
                }));
            }

            function show(message) {
                statusLine.textContent = message || "";
                overlay.hidden = false;
            }

            // The files the pack builder reads (install::pack), from the
            // folder that holds REBEXE.EXE.
            function gameFiles(files) {
                const paths = files.map(file => file.webkitRelativePath || file.name);
                const exe = paths.find(path => /(^|\/)REBEXE\.EXE$/i.test(path));
                if (exe === undefined) {
                    return null;
                }
                const root = exe.slice(0, exe.length - "REBEXE.EXE".length).toUpperCase();
                const chosen = [];
                files.forEach((file, index) => {
                    const path = paths[index];
                    if (!path.toUpperCase().startsWith(root)) {
                        return;
                    }
                    const rest = path.slice(root.length).toUpperCase();
                    if (/^[^/]+\.(DLL|DLL\.OLD|EXE)$/.test(rest)
                        || /^GDATA\/[^/]+\.(DAT|SPT)$/.test(rest)
                        || /^EDATA\/EDATA\.\d{3}$/.test(rest)
                        || /^MDATA\/MDATA\.3\d\d$/.test(rest)) {
                        chosen.push({ path: rest, file });
                    }
                });
                return chosen;
            }

            function pickFolder() {
                return new Promise(resolve => {
                    choose.onclick = () => input.click();
                    input.onchange = () => {
                        const chosen = gameFiles(Array.from(input.files || []));
                        input.value = "";
                        if (chosen === null) {
                            show("That folder has no REBEXE.EXE. Choose the folder the game is installed in.");
                            return;
                        }
                        resolve(chosen);
                    };
                    show("");
                    choose.focus();
                });
            }

            async function answerPack() {
                if (!(await modeOn)) {
                    return null;
                }
                const builder = wasm_exports.open_rebellion_own_data_builder();
                try {
                    const kept = await withStore("readonly", store => store.get(KEY));
                    if (kept && kept.builder === builder && kept.pack instanceof Blob) {
                        console.info("Open Rebellion loads the game data kept from your files");
                        return new Uint8Array(await kept.pack.arrayBuffer());
                    }
                } catch (error) {
                    console.warn("Open Rebellion could not read its kept game data", error);
                }
                picked = await pickFolder();
                choose.hidden = true;
                show("Building the game data from your files…");
                // Let the message paint before the build holds the page.
                await new Promise(resolve => requestAnimationFrame(() => setTimeout(resolve, 0)));
                return new TextEncoder().encode(picked.map(item => item.path).join("\n"));
            }

            async function answer(url) {
                if (url === "own-data/pack") {
                    return answerPack();
                }
                const match = /^own-data\/file\/(\d+)$/.exec(url);
                const item = match && picked[Number(match[1])];
                if (!item) {
                    return null;
                }
                const bytes = new Uint8Array(await item.file.arrayBuffer());
                picked[Number(match[1])] = null;
                return bytes;
            }

            function register(imports) {
                const fetchFile = imports.env.fs_load_file;
                imports.env.fs_load_file = function (ptr, len) {
                    const url = UTF8ToString(ptr, len);
                    if (!url.startsWith("own-data/")) {
                        return fetchFile(ptr, len);
                    }
                    const fileId = FS.unique_id;
                    FS.unique_id += 1;
                    answer(url).then(bytes => bytes, error => {
                        console.error("Open Rebellion could not read " + url, error);
                        return null;
                    }).then(bytes => {
                        FS.loaded_files[fileId] = bytes;
                        wasm_exports.file_loaded(fileId);
                    });
                    return fileId;
                };
                imports.env.open_rebellion_own_data_keep = function (ptr, len, builder) {
                    // A Blob: Chromium refuses larger structured values.
                    const pack = new Blob([new Uint8Array(wasm_memory.buffer, ptr, len)]);
                    overlay.hidden = true;
                    // The game keeps the keyboard.
                    document.getElementById("glcanvas").focus();
                    withStore("readwrite", store => store.put({ builder, pack, kept: Date.now() }, KEY))
                        .then(() => console.info("Open Rebellion kept the game data built from your files"),
                            error => console.warn("Open Rebellion could not keep the game data; the folder is asked for again next time", error));
                };
                imports.env.open_rebellion_own_data_failed = function (ptr, len) {
                    const reason = UTF8ToString(ptr, len);
                    show("The game data could not be built from that folder: " + reason);
                    choose.hidden = false;
                    choose.textContent = "Choose another folder";
                    choose.onclick = () => window.location.reload();
                };
            }

            // From the console: drop the kept game data; the next visit asks
            // for the folder again.
            window.openRebellionOwnData = {
                forget: () => withStore("readwrite", store => store.delete(KEY)),
            };

            miniquad_add_plugin({
                register_plugin: register,
                version: 1,
                name: "open_rebellion_own_data",
            });
        }());
    </script>
    <script>load("open-rebellion.wasm");</script>
</body>
</html>
